spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weekend}
    username: ${DB_USER:weekend}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
app:
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  demo: ${DEMO_MODE:false}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:weekend@example.test}
